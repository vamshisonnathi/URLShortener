services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d urlshortener']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      SHORT_URL_BASE: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/urlshortener?schema=public
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 3600
      RATE_LIMIT_CAPACITY: 20
      RATE_LIMIT_REFILL_PER_SEC: 1
    ports:
      - '3000:3000'

volumes:
  pgdata:
